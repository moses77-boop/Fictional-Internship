<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vonda Internship Application</title>
        <style>
            body{
                margin: 0;
                padding: 2rem 1rem;
            }
            form{
                max-width: 720px;
                margin: 0 auto;
                padding: 2rem;
                border-radius: 8px;
            }
            label, legend{
                display: block;
                margin: 1rem 0 0.25rem;
            }
            textarea{
                min-height: 640px;
                line-height: 1.5;
                resize: vertical;
                width: 100%;
                box-sizing: border-box
            }
            input{
                width: 100%;
            }

        </style>
    </head>
    <body>
        <form id="application-form">
            <h1>Internship Application Email</h1>

            <label for="to">To</label>
            <input type="email" id="to" name="to" value="careers@vonda.co.uk" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" value="Application for Engineering Internship" required>

            <fieldset>
                <legend>Message</legend>
            <textarea id="message" name="message" required>
                Dear Hiring Manager,
 
                I am writing to apply for the Engineering Internship at Vonda. I am a motivated and curious aspiring software developer who enjoys solving problems and learning new skills. I am currently training at Code Your Future (CYF), where I am building a strong foundation in JavaScript, HTML and GitHub. I believe my determination, my willingness to learn quickly and my teamwork would make me a valuable addition to your engineering team.
                
                Why I Want to Become a Software Developer
                I want to become a software developer because I love turning ideas into working products that people can use. Software shapes almost every part of our daily lives, and I want to be part of building tools that make things simpler, faster and more accessible. Every time I solve a bug or see my code run for the first time, I am reminded why I chose this path.
                
                My Background
                Before starting my journey into tech, I developed skills in communication, time management and problem solving through my education and previous experiences. These skills taught me to stay patient under pressure, to work well with others and to keep going when things get difficult. I decided to change direction and pursue a career in software development, and I have been committed to it ever since.
                
                What I Am Doing at the Moment
                I am currently attending a bootcamp programme at CYF, where I am learning JavaScript and HTML and using GitHub to manage and share my code. Through the programme I am practising writing clean, readable code, collaborating with other learners and following good version-control habits. I am also building small projects to apply what I learn.
                
                Where I See Myself in the Future
                In the future, I see myself working as a software developer for one of the notable tech companies, contributing to meaningful projects while continuing to learn from experienced engineers. I hope to grow into a skilled developer who writes reliable code and helps others to learn too.
                
                Why Vonda Should Give Me This Opportunity
                An internship at Vonda would give me the chance to learn from experienced engineers and to see how software is built in a professional setting. In return, I would bring enthusiasm, a strong work ethic and a genuine hunger to improve every day. I am ready to take on feedback, ask questions and contribute wherever I can. I would be grateful for the opportunity to prove myself.
                
                Thank you for taking the time to consider my application. I would welcome the chance to discuss how I can contribute to Vonda, and I look forward to hearing from you.
                
                Kind regards,
                [Your Full Name]
                [Your Email Address] | [Your Phone Number]
                GitHub: [Your GitHub Profile Link]
                
            </textarea>
            </fieldset>
            
            <button type="submit">Send Email</button>
        </form>
    </body>
</html>
